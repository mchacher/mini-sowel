[workspace]
resolver = "3"
members = ["crates/core", "crates/host", "crates/sim", "crates/ui-embed"]
# The ESP32 firmware has its own toolchain (Xtensa) and target: built from firmware/.
exclude = ["firmware"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/mchacher/solite"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The password hash (spec 029, D47) runs fast in the debug builds of the tests too.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
