[package]
name = "mini-sowel-core"
description = "The Sowel core of mini-Sowel: no hardware dependency, runs on the Mac and on the ESP32."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
peak_alloc = "0.3"
mini-sowel-sim = { path = "../sim" }
