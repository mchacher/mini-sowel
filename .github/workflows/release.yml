# A release: on a pushed tag vX.Y.Z, the job `firmware` builds the image (no secret: it runs third-party
# build code), the job `sign` signs and checks it (the secret, and no build tool but the host
# program's cargo build) and the job `publish` makes the GitHub release; run by hand, a dry run
# with a throwaway key publishes nothing (spec 038, docs/release.md). The signing key is the secret
# SOLITE_UPDATE_KEY of the GitHub environment `release` (deployment rule: tags v* only), read by
# the `sign` job only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per kind of run: a dry run never cancels (or queues behind) a pending tag run.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  firmware:
    name: build the radio image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The refusals that need no secret, before the 20-minute build (the sign job repeats them).
      - name: Refusals, before anything is built
        run: |
          if [ ! -f release/update-key.pub ]; then
            echo "::error::release/update-key.pub is absent: commit the public key first (see docs/release.md)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME is not on main: a release is tagged on the merge commit of main (see docs/release.md)"
            exit 1
          fi

      - uses: ./.github/actions/firmware-toolchain

      # No key, no environment, no secret: the build tools (build.rs, cmake, pip, npm) are not the
      # signing's neighbours. app.bin carries the committed public key (release.sh checks it).
      - name: Build the radio image
        run: |
          . "$HOME/export-esp.sh"
          sh scripts/release.sh "${GITHUB_REF_NAME#v}" --build-only --out "$RUNNER_TEMP/build"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ runner.temp }}/build
          if-no-files-found: error

  sign:
    name: sign and check the release
    needs: firmware
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refusals, before the host is built
        env:
          SOLITE_UPDATE_KEY: ${{ secrets.SOLITE_UPDATE_KEY }}
        run: |
          if [ -z "$SOLITE_UPDATE_KEY" ]; then
            echo "::error::the secret SOLITE_UPDATE_KEY is not set in the environment release: an unsigned release is never published (see docs/release.md)"
            exit 1
          fi
          unset SOLITE_UPDATE_KEY
          if [ ! -f release/update-key.pub ]; then
            echo "::error::release/update-key.pub is absent: commit the public key first (see docs/release.md)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME is not on main: a release is tagged on the merge commit of main (see docs/release.md)"
            exit 1
          fi

      # The host program is the only thing built here: rustup and cargo, no ESP32 toolchain, no npm.
      - name: Rust, at the version pinned in rust-toolchain.toml
        run: rustup toolchain install

      # Swatinem/rust-cache v2, pinned by its commit SHA; restored, never saved (the key is here).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          shared-key: rust
          save-if: "false"

      - name: Host program
        run: cargo build -p solite-host --release

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware

      - name: Sign and check the release
        env:
          SOLITE_UPDATE_KEY: ${{ secrets.SOLITE_UPDATE_KEY }}
        run: |
          sh scripts/release.sh "${GITHUB_REF_NAME#v}" --key-env SOLITE_UPDATE_KEY \
            --prebuilt "$RUNNER_TEMP/firmware" --out "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  dry-run:
    name: dry run (nothing is published)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/firmware-toolchain

      - name: Host program
        run: cargo build -p solite-host --release

      - name: Throwaway key, then the release script
        run: |
          . "$HOME/export-esp.sh"
          mkdir -p "$RUNNER_TEMP/dry"
          target/release/solite-host --update-keygen "$RUNNER_TEMP/dry/key" > "$RUNNER_TEMP/dry/keygen.txt"
          sed -n 's/^public key: //p' "$RUNNER_TEMP/dry/keygen.txt" > "$RUNNER_TEMP/dry/key.pub"
          echo "Dry run, nothing is published." > "$RUNNER_TEMP/dry/notes.md"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)
          sh scripts/release.sh "$version" --key-file "$RUNNER_TEMP/dry/key" \
            --public-key-file "$RUNNER_TEMP/dry/key.pub" --notes "$RUNNER_TEMP/dry/notes.md" \
            --out "$RUNNER_TEMP/dry-release"

      # Only the manifest and the checksums: no flashable image whose key is lost.
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dry-release/manifest.json
            ${{ runner.temp }}/dry-release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish the GitHub release
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in "solite-$version.sup" "solite-$version-flash.bin" SHA256SUMS manifest.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the release artifact: nothing is published"
              exit 1
            fi
          done
          gh release create "$GITHUB_REF_NAME" \
            "solite-$version.sup" "solite-$version-flash.bin" SHA256SUMS manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "Solite $version" --notes-file notes.md --verify-tag
