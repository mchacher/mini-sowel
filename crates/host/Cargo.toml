[package]
name = "solite-host"
description = "Solite on the Mac: the core with simulated or networked hardware."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ctrlc = "3.5.2"
# Signing of the update files (spec 032): the core only verifies.
ed25519-dalek = "3.0"
httparse = "1.10.1"
log = "0.4"
solite-core = { path = "../core" }
solite-sim = { path = "../sim" }
serde_json = "1"
socket2 = "0.6.5"
tiny_http = "0.12"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true
