[package]
name = "solite-sim"
description = "The simulated radio of Solite: an EmberZNet NCP and Zigbee devices that run on the Mac and in the QEMU image of the firmware, driven by scenario files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
log = "0.4"
solite-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
