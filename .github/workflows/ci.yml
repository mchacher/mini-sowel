# The verdict of CLAUDE.md, on every pull request and on main: sh scripts/validate.sh, cut into
# three jobs that run side by side (`--only rust`, `--only ui`, `--only firmware`): together they
# are exactly the full run, and the slowest one sets the time.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: validate (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust, at the version pinned in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate
        run: sh scripts/validate.sh --only rust

  ui:
    name: validate (ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            tools/z2m-coverage/package-lock.json

      - name: Interface packages
        working-directory: ui
        run: npm ci

      - name: Tools packages
        working-directory: tools/z2m-coverage
        run: npm ci

      - name: Validate
        run: sh scripts/validate.sh --only ui

  firmware:
    name: validate (firmware)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ESPUP_VERSION: v0.19.0
    steps:
      - uses: actions/checkout@v4

      - name: System packages for ESP-IDF
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-venv

      - name: System libraries for QEMU
        run: sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: Rust, at the version pinned in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware -> target

      - name: ESP32 toolchain (espup, ldproxy)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/espup" \
            "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/espup"
          "$RUNNER_TEMP/espup" install --targets esp32 --export-file "$HOME/export-esp.sh"
          cargo install ldproxy --locked

      - name: ESP-IDF download cache
        uses: actions/cache@v4
        with:
          path: firmware/.embuild
          key: esp-idf-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml', 'firmware/Cargo.lock') }}

      # QEMU has its own cache: the ESP-IDF cache key above does not change when QEMU is added, so
      # it would be downloaded on every run. On a miss, scripts/qemu.sh installs it (after the
      # firmware build has downloaded ESP-IDF, which the installer needs) and this step saves it.
      - name: QEMU download cache
        uses: actions/cache@v4
        with:
          path: firmware/.embuild/espressif/tools/qemu-xtensa
          key: qemu-xtensa-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml') }}

      - name: Validate
        run: sh scripts/validate.sh --only firmware
