[workspace]
resolver = "3"
members = ["crates/core", "crates/host"]
# The ESP32 firmware has its own toolchain (Xtensa) and target: built from firmware/.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/mchacher/mini-sowel"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
